$kind: http-request
description: >-
  Remove a support therapist link by the `support_id` (the UUID of the support
  therapist, not the link).


  **Auth:** JWT Bearer (IsTherapistUser)
url: "{{base_url}}/api/contacts/support-therapists/:support_id/"
method: DELETE
pathVariables:
  - key: support_id
    value: 11111111-1111-1111-1111-111111111111
    description: UUID of the SupportTherapist link to remove
order: 4000
