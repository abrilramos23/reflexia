$kind: http-request
description: >-
  Delete an associated contact by UUID. The contact record is fully removed if
  no other patients link to it.


  **Auth:** JWT Bearer (IsAuthenticated + patient)
url: "{{base_url}}/api/contacts/associated/:contact_id/"
method: DELETE
pathVariables:
  - key: contact_id
    value: 11111111-1111-1111-1111-111111111111
    description: UUID of the associated contact
order: 4000
