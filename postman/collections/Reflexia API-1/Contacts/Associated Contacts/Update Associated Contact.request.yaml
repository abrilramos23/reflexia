$kind: http-request
description: |-
  Partially update an existing associated contact by UUID.

  **Auth:** JWT Bearer (IsAuthenticated + patient)
url: "{{base_url}}/api/contacts/associated/:contact_id/"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: contact_id
    value: 11111111-1111-1111-1111-111111111111
    description: UUID of the associated contact
body:
  type: json
  content: |-
    {
      "name": "Maria Perez Updated",
      "is_default": false
    }
order: 3000
