$kind: http-request
description: >-
  Request a password reset link by email. Always returns 200 (to prevent email
  enumeration).


  **Auth:** None (AllowAny)
url: "{{base_url}}/api/users/password/forgot/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com"
    }
auth:
  type: noauth
order: 6000
