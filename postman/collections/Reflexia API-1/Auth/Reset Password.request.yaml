$kind: http-request
description: |-
  Reset password using the uid and token from the reset email link.

  **Auth:** None (AllowAny)
url: "{{base_url}}/api/auth/password/reset/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "uid": "<base64-encoded-user-id>",
      "token": "<reset-token>",
      "password": "NewStrongPass123!",
      "password_confirm": "NewStrongPass123!"
    }
auth:
  type: noauth
order: 7000
