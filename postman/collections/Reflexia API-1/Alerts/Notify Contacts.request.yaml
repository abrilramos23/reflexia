$kind: http-request
description: >-
  Notify emergency contacts about a validated alert.
  Sends notifications to all associated contacts configured for emergency alerts.

  **Request body:**
  - `contact_ids` (array, required): Associated contact IDs to notify
  - `justification` (string, required): Justification that will be included in the notification

  **Auth:** JWT Bearer (IsAuthenticated - Therapist with access to patient)
url: "{{base_url}}/api/alerts/{{alert_id}}/notify-contacts/"
method: POST
order: 5040
body:
  mode: raw
  raw: |
    {
      "contact_ids": ["{{contact_id}}"],
      "justification": "The alert was clinically validated and the patient may benefit from immediate emotional support."
    }
