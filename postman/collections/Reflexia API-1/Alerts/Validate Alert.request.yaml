$kind: http-request
description: >-
  Validate and review a clinical alert (therapist validation required).

  **Request body:**
  - `action` (string, required): `VALIDATE` or `DISMISS`
  - `justification` (string, required when validating): Clinical justification for validating the alert
  - `validation_note` (string, optional): Internal therapist validation note

  **Auth:** JWT Bearer (IsAuthenticated - Therapist with access to patient)
url: "{{base_url}}/api/alerts/{{alert_id}}/"
method: PATCH
order: 5030
body:
  mode: raw
  raw: |
    {
      "action": "VALIDATE",
      "justification": "High-risk indicators require activating the patient's support network.",
      "validation_note": "Scheduled follow-up appointment and provided crisis resources."
    }
