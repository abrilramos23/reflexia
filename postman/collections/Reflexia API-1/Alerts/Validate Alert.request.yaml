$kind: http-request
description: >-
  Validate and review a clinical alert (therapist validation required).

  **Request body:**
  - `status` (string, required): `validated` or `dismissed`
  - `validation_notes` (string, optional): Therapist's validation notes
  - `action_taken` (string, optional): Description of actions taken

  **Auth:** JWT Bearer (IsAuthenticated - Therapist with access to patient)
url: "{{base_url}}/api/alerts/{{alert_id}}/"
method: PATCH
order: 5030
body:
  mode: raw
  raw: |
    {
      "status": "validated",
      "validation_notes": "Alert acknowledged. Patient showing signs of depression. Recommending psychiatric consultation.",
      "action_taken": "Scheduled follow-up appointment, provided crisis resources"
    }
