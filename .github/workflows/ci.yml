name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reflexiadb
          POSTGRES_USER: reflexia
          POSTGRES_PASSWORD: reflexia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U reflexia -d reflexiadb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: reflexiadb
      DB_USER: reflexia
      DB_PASSWORD: reflexia
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-jwt-tests
      DEBUG: False
      ALLOWED_HOSTS: localhost,

    steps:
      - name: Checkout codi
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instal·lar dependències backend
        working-directory: reflexia-backend
        run: pip install -r requirements.txt

      - name: Executar linting backend
        working-directory: reflexia-backend
        run: python manage.py check

      - name: Executar tests backend
        working-directory: reflexia-backend
        run: python manage.py test

      - name: Instal·lar dependències frontend
        working-directory: reflexia-frontend
        run: npm install

      - name: Executar linting frontend
        working-directory: reflexia-frontend
        run: npm run lint
